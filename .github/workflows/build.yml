name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop
        run: ./gradlew :composeApp:compileKotlinDesktop
      - name: Assemble Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Run checks
        run: ./gradlew :shared:desktopTest :composeApp:desktopTest

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
